services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: braindump-sqlserver
    user: root
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-BrainDump@2026Pass}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data

volumes:
  sqlserver_data:
