<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #13121c;
            color: #e4e1ee;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(31, 31, 40, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .priority-high { color: #ffb4ab; background: rgba(147, 0, 10, 0.2); }
        .priority-medium { color: #ffb68f; background: rgba(190, 84, 0, 0.2); }
        .priority-low { color: #54d8e8; background: rgba(2, 174, 190, 0.2); }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>

<body class="min-h-screen pb-40">
<!-- Background Shader Atmosphere -->

<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-sm">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden border border-primary/20">
<img class="w-full h-full object-cover" data-alt="A close-up portrait of a professional man with a thoughtful expression, set against a blurred urban background with soft indigo and teal lighting. The photography style is sharp, modern, and cinematic, emphasizing mental clarity and focus. The overall color palette is dark and moody, aligned with a high-end minimalist tech brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDSiGEHLuCHQqz8Yd9prOs09isBB16Ahwd-iZV3xtiY0xDIxKDbK340syZHfQN1zi7ydo0OmwnLxnJYyemp0QbfT8Ouqmmlvfiov4bilRJ3QO8crxM2ZzS_BsVoKSjb7GAyu5GoU3Fw_DlbIpUn5yhGmiGlajBWmAckNNjW9HBqtGFC543SUKNPcbUjtvGUtf84Zpdh3qUAUh4S8ZnEpTXpdNr8Hjfq-dN1l_vyGLK03ncvipMXUf4B"/>
</div>
<span class="font-display text-display text-primary dark:text-primary tracking-tight text-[20px]">BrainDump</span>
</div>
<button class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-opacity">settings</button>
</header>
<main class="pt-24 px-margin-mobile max-w-[600px] mx-auto relative z-10">
<!-- Headline Section -->
<div class="mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1">Review your tasks</h1>
<p class="font-body-md text-body-md text-on-surface-variant">3 items captured from your last session.</p>
</div>
<!-- Task List -->
<div class="flex flex-col gap-4">
<!-- Task 1: Project Proposal -->
<div class="glass-card rounded-xl p-md flex flex-col gap-3 transition-all hover:scale-[1.01] active:scale-[0.98]">
<div class="flex justify-between items-start">
<h3 class="font-body-lg text-body-lg font-bold text-on-surface">Send the project proposal</h3>
<button class="material-symbols-outlined text-on-surface-variant text-[20px]">edit</button>
</div>
<div class="flex flex-wrap gap-2 items-center">
<span class="px-3 py-1 rounded-full font-label-sm text-label-sm bg-primary-container/20 text-primary border border-primary/20">Work</span>
<span class="px-3 py-1 rounded-full font-label-sm text-label-sm priority-high flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-error"></span>
                        High Priority
                    </span>
<span class="flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant ml-auto">
<span class="material-symbols-outlined text-[14px]">calendar_today</span>
                        Friday
                    </span>
</div>
</div>
<!-- Task 2: Groceries -->
<div class="glass-card rounded-xl p-md flex flex-col gap-3 transition-all hover:scale-[1.01] active:scale-[0.98]">
<div class="flex justify-between items-start">
<h3 class="font-body-lg text-body-lg font-bold text-on-surface">Buy groceries</h3>
<button class="material-symbols-outlined text-on-surface-variant text-[20px]">edit</button>
</div>
<div class="flex flex-wrap gap-2 items-center">
<span class="px-3 py-1 rounded-full font-label-sm text-label-sm bg-secondary-container/20 text-secondary border border-secondary/20">Personal</span>
<span class="px-3 py-1 rounded-full font-label-sm text-label-sm priority-low flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
                        Low Priority
                    </span>
<span class="flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant ml-auto">
<span class="material-symbols-outlined text-[14px]">today</span>
                        Today
                    </span>
</div>
</div>
<!-- Task 3: Dentist -->
<div class="glass-card rounded-xl p-md flex flex-col gap-3 transition-all hover:scale-[1.01] active:scale-[0.98]">
<div class="flex justify-between items-start">
<h3 class="font-body-lg text-body-lg font-bold text-on-surface">Call the dentist</h3>
<button class="material-symbols-outlined text-on-surface-variant text-[20px]">edit</button>
</div>
<div class="flex flex-wrap gap-2 items-center">
<span class="px-3 py-1 rounded-full font-label-sm text-label-sm bg-secondary-container/20 text-secondary border border-secondary/20">Personal</span>
<span class="px-3 py-1 rounded-full font-label-sm text-label-sm priority-medium flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>
                        Medium Priority
                    </span>
<span class="flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant ml-auto">
<span class="material-symbols-outlined text-[14px]">calendar_today</span>
                        Thursday
                    </span>
</div>
</div>
</div>

<div class="mt-12 flex justify-center opacity-40">
<div class="w-24 h-24 rounded-full bg-primary/10 blur-3xl animate-pulse"></div>
</div>
</main>
<!-- Bottom Actions & Navigation Shell -->
<div class="fixed bottom-0 left-0 w-full z-50">
<!-- Review Action Bar -->
<div class="px-4 pb-6 pt-4 bg-gradient-to-t from-background via-background/90 to-transparent flex flex-col gap-3">
<button class="w-full h-14 bg-primary text-on-primary font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-95 transition-transform">
                Confirm all
                <span class="material-symbols-outlined">done_all</span>
</button>
<button class="w-full h-12 border border-outline/30 text-on-surface font-label-md rounded-xl flex items-center justify-center transition-colors hover:bg-surface-variant/30 active:scale-95 transition-transform">
                Edit individually
            </button>
</div>
<!-- Shared BottomNavBar -->
<nav class="w-full flex justify-around items-center px-4 pb-safe h-20 bg-surface-container/80 dark:bg-surface-container/80 backdrop-blur-xl border-t border-white/10 shadow-[0_-4px_20px_rgba(0,0,0,0.1)] rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary/80 transition-all duration-200">

<span class="material-symbols-outlined">checklist</span>
<span class="font-label-sm text-label-sm">Tasks</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary/80 transition-all duration-200">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
</div>
<script>
        // Simple Micro-interactions
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('click', () => {
                // Flash interaction
                card.style.borderColor = 'rgba(195, 192, 255, 0.4)';
                setTimeout(() => {
                    card.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                }, 200);
            });
        });
    </script>
