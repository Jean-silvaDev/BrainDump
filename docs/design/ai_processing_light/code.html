<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }

        body {
            background-color: hsl(220, 20%, 97%);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Ambient Glows */
        .ambient-glow {
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle at center, rgba(88, 66, 211, 0.08) 0%, rgba(0, 104, 122, 0.05) 30%, transparent 70%);
            z-index: -1;
            animation: pulse-glow 10s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) rotate(0deg); opacity: 0.5; }
            100% { transform: scale(1.1) rotate(5deg); opacity: 0.8; }
        }

        /* Orb Container */
        .orb-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Indeterminate Progress Bar */
        .progress-bar-container {
            width: 200px;
            height: 4px;
            background: rgba(88, 66, 211, 0.1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            position: absolute;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #5842d3, #6ee1fd);
            border-radius: 999px;
            animation: indeterminate 2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        @keyframes indeterminate {
            0% { left: -40%; width: 30%; }
            50% { width: 50%; }
            100% { left: 100%; width: 30%; }
        }

        /* Floating elements effect */
        .float-slow {
            animation: floating 4s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>

<body class="flex flex-col items-center justify-center relative">
<!-- Background Decoration -->
<div class="ambient-glow"></div>
<!-- Subtle Top Logo (Non-nav) -->
<div class="absolute top-12 left-0 w-full flex justify-center opacity-40">
<span class="font-display text-headline-md text-primary tracking-tight">BrainDump</span>
</div>
<!-- Main Content Area -->
<main class="z-10 flex flex-col items-center gap-12 px-margin_mobile text-center">
<!-- Animated Orb Segment -->
<div class="orb-wrapper float-slow">
<!-- ThreeJS scene for the particle orb -->

<!-- Secondary blur for depth -->
<div class="absolute inset-0 rounded-full bg-primary/5 blur-3xl -z-10"></div>
</div>
<!-- Feedback Section -->
<div class="space-y-6 flex flex-col items-center">
<div class="flex flex-col gap-2">
<h1 class="font-headline-md text-headline-md-mobile text-on-surface">
                    Transcribing your voice...
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                    Turning your flow of thoughts into organized clarity.
                </p>
</div>
<!-- Indeterminate Progress -->
<div class="progress-bar-container mt-4">
<div class="progress-bar-fill"></div>
</div>
<!-- Dynamic Micro-Status -->
<div class="font-label-sm text-label-sm text-primary uppercase tracking-widest opacity-80 h-4 overflow-hidden" id="status-ticker">
<span class="block transition-transform duration-500" id="ticker-text">Cleaning Audio</span>
</div>
</div>
</main>
<!-- Bottom Context (Instructional/Atmospheric) -->
<div class="absolute bottom-16 flex flex-col items-center gap-4 px-margin_mobile">
<div class="glass-panel px-6 py-3 rounded-full flex items-center gap-3">
<span class="material-symbols-outlined text-secondary animate-pulse" style="font-size: 20px;">graphic_eq</span>
<span class="font-label-md text-label-md text-on-surface-variant">42 seconds recorded</span>
</div>
<button class="mt-4 font-label-md text-label-md text-error px-4 py-2 hover:bg-error/5 rounded-full transition-colors cursor-pointer active:scale-95">
            Cancel Processing
        </button>
</div>
<!-- Micro-interaction Script -->
<script>
        // Simple ticker for the status text to show progress depth
        const statusPhrases = [
            "Cleaning Audio",
            "Extracting Keywords",
            "Synthesizing Context",
            "Formatting Layout",
            "Generating Insights"
        ];
        let currentPhrase = 0;
        const tickerElement = document.getElementById('ticker-text');

        setInterval(() => {
            tickerElement.classList.add('opacity-0', '-translate-y-4');
            
            setTimeout(() => {
                currentPhrase = (currentPhrase + 1) % statusPhrases.length;
                tickerElement.innerText = statusPhrases[currentPhrase];
                tickerElement.classList.remove('opacity-0', '-translate-y-4');
                tickerElement.classList.add('translate-y-0', 'opacity-100');
            }, 500);
        }, 3000);

        // Visual feedback for the particle orb on touch/move (simulated atmospheric interaction)
        document.addEventListener('mousemove', (e) => {
            const orb = document.querySelector('.orb-wrapper');
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const strength = 15;
            const moveX = (x / rect.width) * strength;
            const moveY = (y / rect.height) * strength;
            
            orb.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body></html>
