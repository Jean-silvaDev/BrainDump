<script>
        // Simple Interaction: Mic button toggle state simulation
        const micBtn = document.getElementById('mic-btn');
        let isRecording = false;

        micBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                micBtn.style.backgroundColor = '#ba1a1a'; // Switch to error color for recording
                micBtn.querySelector('span').innerText = 'stop';
                document.querySelector('p').innerText = 'Listening...';
                document.querySelector('p').classList.add('text-error');
            } else {
                micBtn.style.backgroundColor = '#725ded'; // Back to primary-container
                micBtn.querySelector('span').innerText = 'mic';
                document.querySelector('p').innerText = 'Tap to start recording';
                document.querySelector('p').classList.remove('text-error');
            }
        });

        // Add haptic-like scaling on touch
        const navButtons = document.querySelectorAll('nav button');
        navButtons.forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.95)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
