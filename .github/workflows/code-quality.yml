name: Code Quality & Security Audit

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Linting & Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Workloads
        run: dotnet workload restore

      - name: Restore Dependencies
        run: dotnet restore BrainDump.slnx

      - name: Verify Code Formatting (.editorconfig)
        run: dotnet format whitespace --verify-no-changes

      - name: Audit NuGet Package Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive
